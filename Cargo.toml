[package]
name = "sqlite-ivm"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Transactional incremental SQL views for SQLite using persistent virtual-table operator state"
readme = "README.md"

[workspace]

[lib]
name = "sqlite_ivm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# SQLite's own page cache, not the system dylib's purgeable one (plans/costs/README.md).
# Extension builds pass --no-default-features: the host supplies SQLite.
default = ["bundled", "census"]
bundled = ["rusqlite/bundled"]
extension = ["rusqlite/loadable_extension"]
# One span per statement site (src/0g_census.rs). Off, the spans compile out and
# a run pays nothing; that build is the one the recipe times wall clock on.
census = []

[dependencies]
hafley-observe = { path = "../../../../hafley-rs/.boop-worktrees/main/crates/hafley-observe" }
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "=0.40.2", features = ["functions", "vtab"] }
sqlite-bulk-trigger = { path = "../../../../hafley-rs/.boop-worktrees/main/crates/sqlite-bulk-trigger" }
sqlite3-parser = "=0.17.0"

[profile.dev]
debug = 0

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"



[profile.dev.package.libsqlite3-sys]
opt-level = 3
