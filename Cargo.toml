[package]
name = "sqlite-ivm"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Transactional incremental SQL views for SQLite using persistent virtual-table operator state"
readme = "README.md"

[workspace]

[lib]
name = "sqlite_ivm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# SQLite's own page cache, not the system dylib's purgeable one (plans/costs/README.md).
# Extension builds pass --no-default-features: the host supplies SQLite.
default = ["bundled", "statements"]
bundled = ["rusqlite/bundled"]
extension = ["rusqlite/loadable_extension", "sqlite-ext/loadable"]
# Compatibility feature for existing test/benchmark recipes. Native and linked
# builds both retain statement spans; runtime filters control recording.
statements = []

[dependencies]
hafley-observe = { path = "../hafley-rs-wt/main-codex-attribution/crates/hafley-observe" }
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "=0.40.2", features = ["functions", "vtab"] }
sqlite-ext = { path = "../hafley-rs-wt/main-codex-attribution/crates/sqlite-ext" }
sqlite3-parser = "=0.17.0"

[profile.dev]
debug = 0

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"



[profile.dev.package.libsqlite3-sys]
opt-level = 3
