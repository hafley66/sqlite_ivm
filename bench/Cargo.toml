[package]
name = "sqlite-ivm-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Circuit shootout and scale sweep harness for sqlite-ivm"

[workspace]

[dependencies]
anyhow = "1"
differential-dataflow = "=0.25.1"
libc = "0.2"
parking_lot = "0.12"
postgres = "0.19"
rusqlite = { version = "=0.40.2", features = ["functions", "vtab", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-ivm = { path = ".." }
sysinfo = "0.33"
timely = "=0.31.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "bench"
path = "src/main.rs"

[profile.release]
# Symbols stay in so `samply` profiles resolve to function and line. Codegen
# is unchanged.
debug = 1
strip = "none"

[[bin]]
name = "crossover-dd"
path = "crossover/22_crossover_dd.rs"
