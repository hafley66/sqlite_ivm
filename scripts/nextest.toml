# Per-test time budgets for the gate. Run it through scripts/9_verify.sh, which
# passes this file with --config-file.
#
# Level 1 of the timeout rail. Every test carries a budget: the 1s default
# below, or one of the four overrides derived from the measured base timings in
# plans/costs/timeout-rail.md. Arithmetic there; raw seconds in
# scripts/timeout-rail.tsv.
[profile.default]
fail-fast = false
retries = 0

# Budget for the 64 tests measured below 1s at 68a88321. 1s is 100x the fastest
# leg observed (0.006s) and 21x the largest run-to-run jitter observed (0.047s).
slow-timeout = { period = "1s", terminate-after = 1, grace-period = "2s" }

[profile.default.junit]
path = "junit.xml"

# Slowest measured leg, 8.928s median. Budget 26.8s, its median times 3.
[[profile.default.overrides]]
filter = 'binary_id(=sqlite-ivm::4_features) and test(=recursion_statement_count_is_linear_in_new_closure_rows)'
slow-timeout = { period = "26.8s", terminate-after = 1, grace-period = "2s" }

# 1.526s median. Budget 4.6s, its median times 3.
[[profile.default.overrides]]
filter = 'binary_id(=sqlite-ivm::8_group_limit) and test(=group_limit_matches_plain_sql_across_multiplicity_limit_and_offset)'
slow-timeout = { period = "4.6s", terminate-after = 1, grace-period = "2s" }

# 1.326s median. Budget 4.0s, its median times 3.
[[profile.default.overrides]]
filter = 'binary_id(=sqlite-ivm::4_features) and test(=feature_compositions_against_sqlite)'
slow-timeout = { period = "4.0s", terminate-after = 1, grace-period = "2s" }

# 0.426s median, the only other leg above the 1s floor. Budget 1.3s.
[[profile.default.overrides]]
filter = 'binary_id(=sqlite-ivm::1_maintenance) and test(=deterministic_mutations_match_original_join_after_every_statement)'
slow-timeout = { period = "1.3s", terminate-after = 1, grace-period = "2s" }