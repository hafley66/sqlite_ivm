name: SQLite IVM
on:
  push:
    paths: ['.github/workflows/sqlite-ivm.yml']
  pull_request:
    paths: ['.github/workflows/sqlite-ivm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux SQLite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev swi-prolog-nox gnuplot-nox time
      - name: Select macOS SQLite
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install sqlite swi-prolog gnuplot
          echo "SQLITE3_LIB_DIR=$(brew --prefix sqlite)/lib" >> "$GITHUB_ENV"
          echo "SQLITE3_INCLUDE_DIR=$(brew --prefix sqlite)/include" >> "$GITHUB_ENV"
          echo "SQLITE3=$(brew --prefix sqlite)/bin/sqlite3" >> "$GITHUB_ENV"
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path bench/Cargo.toml
      - name: Rust and native acceptance tests
        run: bash scripts/9_verify.sh
      - name: Build extension dylib and bench binary into one target dir
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ivm-target"
          cargo build --locked --release --manifest-path Cargo.toml --no-default-features --features extension
          cargo build --locked --release --manifest-path bench/Cargo.toml
      - name: Smoke shootout across SQLite and DD engines
        run: |
          "$RUNNER_TEMP/ivm-target/release/bench" shootout smoke \
            --engines sqlite-ivm,sqlite-query,dd \
            --out "$RUNNER_TEMP/sqlite-ivm-shootout"
      - name: Verify every supported cell carries a checksum
        run: |
          node -e '
            const fs = require("fs");
            const assert = require("assert/strict");
            const records = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse);
            const totals = records.filter((r) => r.event === "case-total");
            assert.equal(totals.length, 60, `expected 60 cases, got ${totals.length}`);
            const bad = totals.filter((r) => !r.unsupported && (r.error || r.checksum === null));
            assert.equal(bad.length, 0, JSON.stringify(bad, null, 2));
          ' "$RUNNER_TEMP/sqlite-ivm-shootout/circuits.jsonl"
      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-ivm-features-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/sqlite-ivm-shootout/report.md
            ${{ runner.temp }}/sqlite-ivm-shootout/report.json
            ${{ runner.temp }}/sqlite-ivm-shootout/circuits.jsonl
          if-no-files-found: error
      - name: Preserve command logs and failure receipts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-ivm-failed-command-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/sqlite-ivm-shootout
      - name: Build release archive
        run: bash scripts/10_package.sh
      - uses: actions/upload-artifact@v7
        with:
          path: |
            dist/*
            ${{ runner.temp }}/sqlite-ivm-shootout/report.md
            ${{ runner.temp }}/sqlite-ivm-shootout/report.json
            ${{ runner.temp }}/sqlite-ivm-shootout/circuits.jsonl
          if-no-files-found: error
  postgres-ivm:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build bench binary
        run: cargo build --locked --release --manifest-path bench/Cargo.toml
      - name: Build native pg_ivm 1.15
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16 build-essential
          git clone --depth 1 --branch v1.15 https://github.com/sraoss/pg_ivm.git "$RUNNER_TEMP/pg_ivm"
          make -C "$RUNNER_TEMP/pg_ivm" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no
          sudo make -C "$RUNNER_TEMP/pg_ivm" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no install
      - name: Smoke shootout against PostgreSQL and pg_ivm
        env:
          IVM_POSTGRES_PREFIX: /usr/lib/postgresql/16
        run: |
          target/release/bench shootout smoke \
            --engines pg-ivm,pg-query \
            --out "$RUNNER_TEMP/sqlite-ivm-pg"
      - name: Verify pg_ivm support split and pg-query coverage
        run: |
          node -e '
            const fs = require("fs");
            const assert = require("assert/strict");
            const records = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse);
            const totals = records.filter((r) => r.event === "case-total");
            assert.equal(totals.length, 40, `expected 40 cases, got ${totals.length}`);
            const pgQuery = totals.filter((r) => r.engine === "pg-query");
            assert.equal(pgQuery.filter((r) => r.checksum).length, 20, "pg-query must cover all 20 circuits");
            const pgIvm = totals.filter((r) => r.engine === "pg-ivm");
            assert.ok(pgIvm.every((r) => r.checksum || r.unsupported), "pg-ivm cells must resolve or be unsupported");
          ' "$RUNNER_TEMP/sqlite-ivm-pg/circuits.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-ivm-pg-results
          path: |
            ${{ runner.temp }}/sqlite-ivm-pg/report.md
            ${{ runner.temp }}/sqlite-ivm-pg/circuits.jsonl
          if-no-files-found: error
