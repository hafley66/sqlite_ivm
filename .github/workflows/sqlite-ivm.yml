name: SQLite IVM
on:
  push:
    paths: ['.github/workflows/sqlite-ivm.yml']
  pull_request:
    paths: ['.github/workflows/sqlite-ivm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux SQLite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev swi-prolog-nox gnuplot-nox time
      - name: Select macOS SQLite
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install sqlite swi-prolog gnuplot
          echo "SQLITE3_LIB_DIR=$(brew --prefix sqlite)/lib" >> "$GITHUB_ENV"
          echo "SQLITE3_INCLUDE_DIR=$(brew --prefix sqlite)/include" >> "$GITHUB_ENV"
          echo "SQLITE3=$(brew --prefix sqlite)/bin/sqlite3" >> "$GITHUB_ENV"
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path bench/Cargo.toml
      - name: Rust and native acceptance tests
        run: bash scripts/9_verify.sh
      - name: Unified semantic and performance command
        run: bash scripts/16_shootout.sh smoke --engines sqlite-ivm,dd,prolog,sqlite-query --out "$RUNNER_TEMP/sqlite-ivm-shootout"
      - name: Verify real storage and resident-memory receipts
        run: |
          node --input-type=module - "$RUNNER_TEMP/sqlite-ivm-shootout/performance.jsonl" <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const records=fs.readFileSync(process.argv[2],'utf8').trim().split('\n').map(JSON.parse);
          const mutations=records.filter(r=>r.event==='mutation'&&r.run_kind==='measured');
          const processes=records.filter(r=>r.event==='case-process'&&r.run_kind==='measured');
          assert.ok(mutations.length>0&&processes.length>0,'Missing measured receipts');
          for(const row of mutations)assert.equal(row.state_inventory?.outside_timed_region,true,`${row.maintenance}/${row.circuit}/${row.state}: missing inventory`);
          for(const row of processes)assert.ok(row.process_resources?.peak_rss_bytes?.value>0,`${row.maintenance}/${row.circuit}: missing kernel RSS`);
          NODE
      - name: Receipt rejection and independent oracle tests
        run: node --test bench/52_shootout.test.mjs bench/55_shootout_plot.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-ivm-features-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/sqlite-ivm-shootout/features/*.jsonl
            ${{ runner.temp }}/sqlite-ivm-shootout/features/cases/*.json
          if-no-files-found: error
      - name: Preserve command logs and failure receipts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-ivm-failed-command-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/sqlite-ivm-shootout
      - name: Build release archive
        run: bash scripts/10_package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-ivm-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*
            ${{ runner.temp }}/sqlite-ivm-shootout/report.json
            ${{ runner.temp }}/sqlite-ivm-shootout/report.txt
            ${{ runner.temp }}/sqlite-ivm-shootout/coverage.tsv
            ${{ runner.temp }}/sqlite-ivm-shootout/circuits.jsonl
            ${{ runner.temp }}/sqlite-ivm-shootout/performance.jsonl
            ${{ runner.temp }}/sqlite-ivm-shootout/charts/
            ${{ runner.temp }}/sqlite-ivm-shootout/performance-artifacts/**/process-resources.txt
          if-no-files-found: error
  postgres-features:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: sqlite-ivm-features-Linux-X64
          path: ${{ runner.temp }}/sqlite-ivm-features
      - name: Build native pg_ivm 1.15
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16 build-essential
          git clone --depth 1 --branch v1.15 https://github.com/sraoss/pg_ivm.git "$RUNNER_TEMP/pg_ivm"
          make -C "$RUNNER_TEMP/pg_ivm" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no
          sudo make -C "$RUNNER_TEMP/pg_ivm" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no install
          npm ci --prefix bench/shared --ignore-scripts
      - name: PostgreSQL query semantics and recorded pg_ivm behavior
        env:
          IVM_POSTGRES_PREFIX: /usr/lib/postgresql/16
        run: bash scripts/15_pg_baseline.sh "$RUNNER_TEMP/sqlite-ivm-features"
      - name: PGlite query semantics and recorded bundled pg_ivm behavior
        run: |
          status=0
          node bench/42_feature_run.mjs pglite "$RUNNER_TEMP/sqlite-ivm-features/cases" "$RUNNER_TEMP/pglite-features" > "$RUNNER_TEMP/sqlite-ivm-features/pglite.jsonl" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node bench/45_feature_report.mjs pglite-baseline "$RUNNER_TEMP/sqlite-ivm-features"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-ivm-pg-feature-results
          path: |
            ${{ runner.temp }}/sqlite-ivm-features/pg.jsonl
            ${{ runner.temp }}/sqlite-ivm-features/pglite.jsonl
          if-no-files-found: error
