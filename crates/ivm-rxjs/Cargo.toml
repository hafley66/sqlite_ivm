[package]
name = "ivm-rxjs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ivm-ir = { path = "../ivm-ir" }
serde = "1"
serde_json = "1"
ivm-dd = { path = "../ivm-dd", optional = true }
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }

[[bin]]
name = "dump-fixtures"
path = "src/bin/1_dump_fixtures.rs"
required-features = ["fixtures"]

[features]
fixtures = ["dep:ivm-dd", "dep:rusqlite"]
