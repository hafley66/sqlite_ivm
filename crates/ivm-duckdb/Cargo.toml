[package]
name = "ivm-duckdb"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ivm-ir = { path = "../ivm-ir" }
ivm-engine = { path = "../ivm-engine" }
serde_json = "1"
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
ivm-dd = { path = "../ivm-dd" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
