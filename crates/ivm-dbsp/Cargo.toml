[package]
name = "ivm-dbsp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ivm-ir = { path = "../ivm-ir" }
ivm-engine = { path = "../ivm-engine" }
# `backend-mode` (default) compiles the operators inside dbsp, not in this crate.
dbsp = "=0.363.0"
tracing = "0.1"

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1"
ivm-sqlite = { path = "../ivm-sqlite" }
hafley-observe = { path = "../../hafley-rs/crates/hafley-observe" }
