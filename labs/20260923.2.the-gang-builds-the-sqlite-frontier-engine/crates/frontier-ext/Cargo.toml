[package]
name = "frontier-ext"
version = "0.1.0"
edition = "2021"
publish = false

# A loadable extension cdylib must be its own workspace root: the `loadable`
# sqlite-ext feature selects rusqlite/loadable_extension, which cannot share a
# build graph with the test-side rusqlite/bundled.
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hafley66/hafley-rs"
homepage = "https://github.com/hafley66/hafley-rs"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[lib]
crate-type = ["cdylib"]

[dependencies]
ivm-sqlite = { path = "../../../../crates/ivm-sqlite" }
sqlite-ext = { path = "../../../../hafley-rs/crates/sqlite-ext", features = ["loadable"] }
