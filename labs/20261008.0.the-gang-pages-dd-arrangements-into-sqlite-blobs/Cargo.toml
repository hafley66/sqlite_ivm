[package]
name = "lab-dd-columnar-spill"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
differential-dataflow = "=0.25.1"
timely = "=0.31.0"
columnar = { version = "0.13", default-features = false }
lz4_flex = "0.11"
tempfile = "3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
libc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
