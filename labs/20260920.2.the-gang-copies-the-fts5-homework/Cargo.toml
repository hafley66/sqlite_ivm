[package]
name = "lab_20260920_2"
version = "0.0.0"
edition = "2021"
publish = false

# Own workspace root. A lab never joins the entry point workspace.
[workspace]

[dependencies]
rusqlite = { version = "=0.40.2", features = ["functions", "vtab"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Counters only. The otlp and sqlite features are off: this lab counts spans and
# never calls hafley_observe::sqlite::instrument, whose per-statement warn is priced.
hafley-observe = { version = "=0.1.2", registry = "hafley", default-features = false }

[dev-dependencies]
serde_json = "1"
