[package]
name = "lab_20260924_0"
version = "0.0.0"
edition = "2021"
publish = false

# Own workspace root. A lab never joins the entry point workspace.
[workspace]

[lib]
path = "src/lib.rs"

# The engine crate carries no SQLite dependency; SQLite is the test oracle only.
[dependencies]
differential-dataflow = "=0.25.1"
timely = "=0.31.0"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1"
tracing-subscriber = "0.3"
