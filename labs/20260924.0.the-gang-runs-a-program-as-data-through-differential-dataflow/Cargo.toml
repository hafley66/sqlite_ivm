[package]
name = "lab_20260924_0"
version = "0.0.0"
edition = "2021"
publish = false

# Own workspace root. A lab never joins the entry point workspace.
[workspace]

[lib]
path = "src/lib.rs"

# Without features the crate links no SQLite; SQLite is then the test oracle only.
[dependencies]
ivm-ir = { path = "../../crates/ivm-ir" }
ivm-engine = { path = "../../crates/ivm-engine" }
differential-dataflow = "=0.25.1"
timely = "=0.31.0"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }

# The DD engine never links SQLite; `sqlite` adds the SQLite engine behind the same traits.
[features]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1"
tracing-subscriber = "0.3"
